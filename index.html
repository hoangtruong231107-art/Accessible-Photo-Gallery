<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An accessible interactive photo gallery built for WED201c practice.">
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body onload="addTabindex()">
  <header class="site-header">
    <p class="eyebrow">WED201c · ACCESSIBILITY PRACTICE</p>
    <h1>Interactive Photo Gallery</h1>
    <p class="intro">Hover over a photo or move keyboard focus to preview it. Press Tab to explore the gallery.</p>
  </header>

  <main>
    <div id="image" class="preview" role="status" aria-live="polite">
      Hover over an image below to display here.
    </div>

    <section class="gallery" aria-label="Photo gallery">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=900&amp;q=85"
           alt="Golden sunlight over a misty green landscape"
           onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=900&amp;q=85"
           alt="Mountain peaks rising above a quiet valley"
           onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=85"
           alt="A peaceful lake reflecting mountains and trees"
           onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=900&amp;q=85"
           alt="Sunlight filtering through a lush forest"
           onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=900&amp;q=85"
           alt="A scenic alpine lake surrounded by rugged mountains"
           onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=900&amp;q=85"
           alt="Tall rocky mountain peaks beneath a cloudy sky"
           onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">
    </section>
  </main>

  <footer>
    <p>Built with HTML, CSS, and JavaScript.</p>
  </footer>
</body>
</html>
